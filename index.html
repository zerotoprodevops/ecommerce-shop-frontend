<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Store</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .product { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; width: 300px; }
        .btn { background-color: #4CAF50; color: white; padding: 5px 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>My Store</h1>
    <div id="product-list">Loading products...</div>

    <script>
        // In K8, this would be your Ingress URL (e.g., api.mjs.com)
        const PRODUCT_API_URL = 'http://product-service:5000'; 
        const ORDER_API_URL = 'http://order-service:5001';

        async function fetchProducts() {
            try {
                const response = await fetch(`${PRODUCT_API_URL}/products`);
                const products = await response.json();
                
                const list = document.getElementById('product-list');
                list.innerHTML = '';
                
                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    div.innerHTML = `
                        <h3>${p.name}</h3>
                        <p>Price: $${p.price}</p>
                        <button class="btn" onclick="buyProduct(${p.id})">Buy Now</button>
                    `;
                    list.appendChild(div);
                });
            } catch (error) {
                document.getElementById('product-list').innerText = "Error loading products.";
            }
        }

        async function buyProduct(productId) {
            try {
                const response = await fetch(`${ORDER_API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });
                
                if (response.ok) {
                    alert("Order placed successfully!");
                } else {
                    const err = await response.json();
                    alert("Failed: " + err.error);
                }
            } catch (error) {
                alert("Error placing order.");
            }
        }

        // Load products on page load
        fetchProducts();
    </script>
</body>
</html>
